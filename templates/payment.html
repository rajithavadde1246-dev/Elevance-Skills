<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Complete Payment</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            margin: 0;

            padding: 0;
        }


        .payment-box {

            width: 420px;

            max-width: 90%;

            margin: 70px auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.1);
        }


        h2 {

            margin-bottom: 25px;
        }


        p {

            font-size: 17px;

            margin: 15px 0;
        }


        .amount {

            font-size: 25px;

            font-weight: bold;
        }


        .test-note {

            background: #fff8e1;

            padding: 12px;

            border-radius: 8px;

            margin: 20px 0;

            font-size: 14px;

            color: #795548;
        }


        button {

            width: 100%;

            padding: 13px;

            margin-top: 12px;

            border: none;

            border-radius: 6px;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        .success-btn {

            background: #222;
        }


        .success-btn:hover {

            background: #444;
        }


        .failed-btn {

            background: #c62828;
        }


        .failed-btn:hover {

            background: #a51f1f;
        }


        .cancel-btn {

            background: #757575;
        }


        .cancel-btn:hover {

            background: #555;
        }


        button:disabled {

            background: #999;

            cursor: not-allowed;
        }


        #message {

            margin-top: 20px;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="payment-box">


    <h2>
        Complete Your Payment
    </h2>


    <p>

        Booking ID:

        <strong>
            #{{ booking.id }}
        </strong>

    </p>


    <p>

        Amount:

        <span class="amount">

            ₹{{ booking.total_amount }}

        </span>

    </p>


    <div class="test-note">

        <strong>
            Test Payment Mode
        </strong>

        <br>

        No real money will be charged.

    </div>


    <!-- TEST SUCCESS -->

    <button
        class="success-btn"
        id="success-button"
        onclick="testSuccess()"
    >

        Test Successful Payment

    </button>


    <!-- TEST FAILED -->

    <button
        class="failed-btn"
        id="failed-button"
        onclick="testFailed()"
    >

        Test Failed Payment

    </button>


    <!-- TEST CANCELLED -->

    <button
        class="cancel-btn"
        id="cancel-button"
        onclick="testCancel()"
    >

        Cancel Payment

    </button>


    <div id="message"></div>


</div>


<script>


    const message =
        document.getElementById(
            "message"
        );


    const successButton =
        document.getElementById(
            "success-button"
        );


    const failedButton =
        document.getElementById(
            "failed-button"
        );


    const cancelButton =
        document.getElementById(
            "cancel-button"
        );


    /*
     * Disable all buttons
     */

    function disableButtons() {

        successButton.disabled = true;

        failedButton.disabled = true;

        cancelButton.disabled = true;

    }


    /*
     * TEST SUCCESSFUL PAYMENT
     */

    function testSuccess() {

        disableButtons();

        message.innerText =
            "Processing test payment...";

        message.style.color =
            "black";


        window.location.href =
            "{% url 'demo_payment' booking.id %}";

    }


    /*
     * TEST FAILED PAYMENT
     */

    function testFailed() {

        disableButtons();

        message.innerText =
            "Processing failed payment...";

        message.style.color =
            "red";


        window.location.href =
            "{% url 'demo_failed_payment' booking.id %}";

    }


    /*
     * TEST CANCELLED PAYMENT
     *
     * No Razorpay credentials required.
     */

    function testCancel() {

        disableButtons();

        message.innerText =
            "Cancelling test payment...";

        message.style.color =
            "orange";


        window.location.href =
            "{% url 'demo_cancelled_payment' booking.id %}";

    }


</script>


</body>

</html>
