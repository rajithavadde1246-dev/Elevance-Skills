<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .box {
            width: 420px;
            margin: 90px auto;
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .success {
            font-size: 50px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 20px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="success">✓</div>

    <h2>Payment Successful!</h2>

    <p>Your movie tickets have been booked successfully.</p>

    {% if booking %}
        <p>
            Booking ID:
            <strong>#{{ booking.id }}</strong>
        </p>
    {% endif %}

    <a href="/" class="button">Go Home</a>

    <a href="/history/" class="button">View Bookings</a>

</div>

</body>
</html>
