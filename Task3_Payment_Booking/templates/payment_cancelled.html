<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment Cancelled</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            margin: 0;

            padding: 0;
        }


        .box {

            width: 420px;

            max-width: 90%;

            margin: 80px auto;

            background: white;

            padding: 35px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.1);
        }


        h2 {

            color: #555;

            margin-bottom: 25px;
        }


        p {

            font-size: 17px;

            margin: 15px 0;
        }


        .status {

            font-weight: bold;

            color: #757575;
        }


        a {

            display: inline-block;

            margin-top: 25px;

            padding: 12px 20px;

            background: #222;

            color: white;

            text-decoration: none;

            border-radius: 6px;
        }


        a:hover {

            background: #444;
        }

    </style>

</head>


<body>


<div class="box">


    <h2>
        Payment Cancelled
    </h2>


    <p>

        Your payment was cancelled successfully.

    </p>


    <p>

        Booking ID:

        <strong>
            #{{ booking.id }}
        </strong>

    </p>


    <p>

        Payment Status:

        <span class="status">
            Cancelled
        </span>

    </p>


    <p>

        Your reserved seats have been released.

    </p>


    <a href="{% url 'booking_history' %}">

        View Booking History

    </a>


</div>


</body>

</html>
