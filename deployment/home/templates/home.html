<!DOCTYPE html>
<html>
<head>
    <title>ElevanceSkills Internship</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 35px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .tasks {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-top: 0;
        }

        .number {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>ElevanceSkills Internship</h1>
    <p>Full Stack Web Development – Tasks 1 to 6</p>
</header>

<div class="container">

    <h2>My Internship Projects</h2>

    <div class="tasks">

        {% for task in tasks %}
        <div class="card">
            <div class="number">TASK {{ task.number }}</div>
            <h2>{{ task.title }}</h2>
            <p>{{ task.description }}</p>
        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
