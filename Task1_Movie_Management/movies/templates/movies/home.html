<!DOCTYPE html>
<html>
<head>
    <title>Movie Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 10px;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎬 Movie Management System</h1>
    <p>Manage Movies, Shows, Bookings and Reviews</p>
</header>

<div class="container">

    <div class="card">
        <h2>🎥 Sarrainodu</h2>

        <p>
            Telugu Action Movie starring Allu Arjun.
        </p>

        <a class="button" href="/movie/1/">
            View Movie
        </a>

        <a class="button" href="/movie/1/book/">
            🎟 Book Movie
        </a>

        <a class="button" href="/movie/1/review/">
            ⭐ Add Review
        </a>
    </div>

    <div class="card">
        <h2>🔐 User Account</h2>

        <a class="button" href="/register/">
            Register
        </a>

        <a class="button" href="/login/">
            Login
        </a>
    </div>

    <div class="card">
        <h2>⚙️ Administration</h2>

        <a class="button" href="/admin/">
            Open Admin Panel
        </a>
    </div>

</div>

</body>
</html>
