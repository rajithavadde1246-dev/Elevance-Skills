<!DOCTYPE html>
<html>
<head>
    <title>Add Review</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            width: 60%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 25px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⭐ Add Review</h1>

    <p>
        <strong>Movie:</strong>
        {{ movie.title }}
    </p>

    <form method="POST">

        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="error">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <label>
            <strong>Rating</strong>
        </label>

        <select name="rating" required>

            <option value="">-- Select Rating --</option>
            <option value="5">⭐⭐⭐⭐⭐ 5</option>
            <option value="4">⭐⭐⭐⭐ 4</option>
            <option value="3">⭐⭐⭐ 3</option>
            <option value="2">⭐⭐ 2</option>
            <option value="1">⭐ 1</option>

        </select>

        {% if form.rating.errors %}
            <div class="error">
                {{ form.rating.errors }}
            </div>
        {% endif %}

        <label>
            <strong>Comment</strong>
        </label>

        <textarea
            name="comment"
            rows="5"
            placeholder="Write your review..."
            required
        >{{ form.comment.value|default:'' }}</textarea>

        {% if form.comment.errors %}
            <div class="error">
                {{ form.comment.errors }}
            </div>
        {% endif %}

        <button type="submit">
            Submit Review
        </button>

    </form>

    <a href="{% url 'movie_detail' movie.id %}">
        ← Back to Movie
    </a>

</div>

</body>
</html>
